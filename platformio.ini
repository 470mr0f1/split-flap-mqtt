[env:esp12-f]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L  ; Optional: sets CPU frequency to 160 MHz
upload_speed = 115200
upload_resetmethod = nodemcu
monitor_speed = 115200
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.0
    tzapu/WiFiManager@^0.16.0

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; OTA upload environment - use with: pio run -e ota -t upload
[env:esp12-f_ota]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L  ; Optional: sets CPU frequency to 160 MHz
upload_protocol = espota
upload_port = 172.23.0.186
upload_flags =
    --auth=flaps-ota-secret
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.0
    tzapu/WiFiManager@^0.16.0

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
